[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "probegoblin"
version = "0.1.0"
description = "Poking around where it matters. Safe first-pass checks for authorised web application tests."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Taine" }]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.27,<1",
    "playwright>=1.45",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "semver>=3.0",
    "mmh3>=4.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "black>=24"]

[project.urls]
Homepage = "https://github.com/eniat/probe-goblin"

[project.scripts]
probegoblin = "probegoblin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["probegoblin"]

[tool.hatch.build.targets.sdist]
include = ["probegoblin", "config", "tests", "README.md", "LICENSE"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
ignore = ["UP042"]  # Status(str, Enum) is part of the results model

[tool.ruff.lint.per-file-ignores]
"probegoblin/core/jsruntime.py" = ["E501"]  # embedded JavaScript

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
