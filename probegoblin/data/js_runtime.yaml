# JSGoblin runtime detection. Each entry:
#   name      display name
#   npm       npm package, used for latest-version and CVE lookups
#   version   expressions tried in order; property reads only (validated at load)
#   detect    optional: library counts as present when this is defined (version may be unknown)
#   unless    optional: skip the entry when any of these is defined (tells look-alikes apart)
#   template  optional: turns the raw value into the npm version, e.g. "0.{}.0" for three.js
#   eol       optional endoflife.date product
#   test      file inside the npm package used by tests/verify_js_runtime.py
#   test_version / requires   pin for verification, and libraries loaded first
#   verified  npm version the expressions were checked against in Chromium, or false
